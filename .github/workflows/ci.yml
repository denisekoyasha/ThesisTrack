# GitHub Actions CI Workflow for ThesisTrack
# Generated based on actual test file analysis:
# - All tests use PDO mocks (no real MySQL connection required)
# - Tests rely on PHPUNIT_RUNNING constant for bypass logic
# - PHPUnit 10.x with vendor/autoload.php bootstrap

name: ThesisTrack CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    name: PHP ${{ matrix.php-version }} Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo, pdo_mysql, mbstring, xml, curl, gd, zip
          coverage: xdebug
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: |
            composer-${{ matrix.php-version }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create required directories
        run: |
          mkdir -p uploads/chapters
          mkdir -p .phpunit.cache

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --configuration phpunit.xml --testdox --colors=always
        env:
          # Environment variables matching phpunit.xml configuration
          DB_HOST: 127.0.0.1
          DB_NAME: thesis_track
          DB_USER: root
          DB_PASS: ""

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-php-${{ matrix.php-version }}
          path: .phpunit.cache/
          retention-days: 7

  # Optional: Run specific test suites separately for better visibility
  test-suites:
    name: Test Suite - ${{ matrix.suite }}
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        suite: [Unit, Authentication, Features]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, xml, curl, gd, zip
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.2-${{ hashFiles('composer.lock', 'composer.json') }}
          restore-keys: |
            composer-8.2-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create required directories
        run: |
          mkdir -p uploads/chapters
          mkdir -p .phpunit.cache

      - name: Run ${{ matrix.suite }} test suite
        run: vendor/bin/phpunit --configuration phpunit.xml --testsuite ${{ matrix.suite }} --testdox --colors=always
        env:
          DB_HOST: 127.0.0.1
          DB_NAME: thesis_track
          DB_USER: root
          DB_PASS: ""

  # Syntax check for all PHP files
  lint:
    name: PHP Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: php-parallel-lint

      - name: Run PHP syntax check
        run: |
          find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l
